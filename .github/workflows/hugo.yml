name: Deploy Hugo Site to GitHub Pages

on:
  # Build and deploy whenever something is pushed to main
  push:
    branches:
      - main

  # Also allow manual deployment from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:

  # ----------------------------------------------------------
  # Build Hugo Site
  # ----------------------------------------------------------
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.166.0

    steps:

      # Get the repository
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Hextra is installed as a Hugo Module, so Go is required
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      # Configure GitHub Pages
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Install the same Hugo Extended version we use locally
      - name: Install Hugo Extended
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb

          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      # Build the website
      - name: Build Hugo Site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Upload Hugo's generated public directory
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public


  # ----------------------------------------------------------
  # Deploy Site
  # ----------------------------------------------------------
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4